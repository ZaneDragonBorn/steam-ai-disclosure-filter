[plugin]
id = "dev.zanedb.ai-disclosure-filter"
name = "AI Disclosure Filter"
version = "0.7.15"
author = "Zane Dragonborn"
description = "Brings Generative AI Filters across Steam UI alongside configuration for personalization."

[assets]
resources = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[webkit]
entry = "webview/preload.ts"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"

[logger]
backend_prefix = "AI BACKEND"
frontend_prefix = "AI SETTINGS"
webview_prefix = "AI STORE"
